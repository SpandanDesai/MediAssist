name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    # A real MongoDB is provided so the driver/connection path can be exercised
    # end-to-end; the suite itself also runs against the in-memory fallback store.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://localhost:27017/mediassist_ci
      MONGODB_DATABASE: mediassist_ci
      SECRET_KEY: ci-only-secret-key-not-for-production
      ENVIRONMENT: development
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned to 3.12: the obesity joblib artifacts are pickled under
          # scikit-learn 1.6.1 (see backend/requirements.txt), which has no
          # wheels for Python 3.13+. Do NOT bump this without re-exporting the
          # ML artifacts under the new scikit-learn version.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Guard: the ML artifacts are version-coupled to scikit-learn 1.6.1. If a
      # cache/dependency-resolution change ever installs a different version,
      # fail loudly here instead of surfacing a confusing joblib unpickle error
      # (AttributeError: _RemainderColsList) inside the model tests.
      - name: Enforce scikit-learn pin
        run: |
          python - <<'PY'
          import sys
          import sklearn
          expected = "1.6.1"
          if sklearn.__version__ != expected:
              print(f"::error:: scikit-learn {sklearn.__version__} installed, expected {expected} "
                    f"(pinned for the obesity joblib artifacts).")
              sys.exit(1)
          print(f"scikit-learn pin OK: {sklearn.__version__} on Python {sys.version.split()[0]}")
          PY

      - name: Connectivity smoke (Mongo service reachable)
        run: |
          python - <<'PY'
          import asyncio, os
          from motor.motor_asyncio import AsyncIOMotorClient

          async def main():
              client = AsyncIOMotorClient(os.environ["MONGODB_URI"], serverSelectionTimeoutMS=5000)
              await client.admin.command("ping")
              print("Mongo reachable")
              client.close()

          asyncio.run(main())
          PY

      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
